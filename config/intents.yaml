names: [阿格斯, 阿克斯, 奥克斯]

intents:
  - id: weather_today
    patterns:
      - "(帮我|给我)?(查查|看看|查一下|看一下|查|看)?(今天|现在|外面|今天外面)?的?天气(怎么样|如何|咋样|好吗|好不好)?(啊|呀|呢)?"
      - "(今天|现在|外面)?(是)?什么天气(啊|呀)?"
      - "(今天|外面)?(会不会下雨|会下雨吗|下雨吗|下不下雨)"
      - "(今天|外面)?(冷不冷|热不热|冷吗|热吗)"
    tool: weather.get
    reply: "现在{now}。今天{today}。"

  - id: weather_tomorrow
    patterns:
      - "(帮我|给我)?(查查|看看|查一下|看一下|查|看)?明天的?天气(怎么样|如何|咋样|好吗|好不好)?(啊|呀|呢)?"
      - "明天(是)?什么天气(啊|呀)?"
      - "明天(会不会下雨|会下雨吗|下雨吗|下不下雨)"
      - "明天(冷不冷|热不热|冷吗|热吗)"
    tool: weather.get
    reply: "明天{tomorrow}。"

  - id: time_now
    patterns:
      - "(现在)?(几点了|几点|几点钟|几点钟了|什么时间|什么时间了)(啊|呀|呢)?"
    reply: "现在{time}。"

  - id: stop
    patterns:
      - "(别说了|不用说了|闭嘴)(吧|一下)?"
      - "(暂停|停|停下|停一下|停下来|安静)(吧|一下)?"
    reply: ""
    ends_conversation: true

  - id: timer_minutes
    patterns:
      - '(帮我|给我)?(定|设|订|设置|来)?(一)?(个)?(?P<minutes>\d{1,4}|[零一二两三四五六七八九十百]{1,5})分钟的?(闹钟|计时器?|倒计时|提醒)'
      - '(?P<minutes>\d{1,4}|[零一二两三四五六七八九十百]{1,5})分钟(以)?后(叫我|喊我|提醒我)(一下)?'
    tool: timer.set
    args: { minutes: "{minutes}" }
    reply: "好，{duration}后叫你。"

  - id: timer_hours
    patterns:
      - '(帮我|给我)?(定|设|订|设置|来)?(一)?(个)?(?P<hours>\d{1,2}|[一二两三四五六七八九十]{1,3})(个)?小时的?(闹钟|计时器?|倒计时|提醒)'
      - '(?P<hours>\d{1,2}|[一二两三四五六七八九十]{1,3})(个)?小时(以)?后(叫我|喊我|提醒我)(一下)?'
    tool: timer.set
    args: { hours: "{hours}" }
    reply: "好，{duration}后叫你。"

  - id: timer_half_hour
    patterns:
      - '(帮我|给我)?(定|设|订|设置|来)?(个)?半(个)?小时的?(闹钟|计时器?|倒计时|提醒)'
      - '半(个)?小时(以)?后(叫我|喊我|提醒我)(一下)?'
    tool: timer.set
    args: { minutes: 30 }
    reply: "好，{duration}后叫你。"

  - id: ac_on
    patterns:
      - "(帮我|给我)?(打开|开开|开)(一下|下)?(个)?空调(吧|啊|呀)?"
      - "(帮我|给我)?(把)?空调(打开|开开|开一下|开下|开)(吧|啊|呀)?"
    tool: ha.ac_on
    reply: "好。"

  - id: ac_off
    patterns:
      - "(帮我|给我)?(关闭|关掉|关上|关了|关)(一下|下)?(个)?空调(吧|啊|呀)?"
      - "(帮我|给我)?(把)?空调(关闭|关掉|关上|关了|关一下|关下|关)(吧|啊|呀)?"
    tool: ha.ac_off
    reply: "好。"

  - id: ac_set_temperature
    patterns:
      - '(帮我|给我)?(把)?空调(的?温度)?(调到|调成|调为|设成|设为|设置成|设置为|设到|开到|调|设)?(?P<degrees>\d{2}|[二三]?十[一二三四五六七八九]?)度(吧|啊|呀)?'
    tool: ha.ac_set_temperature
    args: { temperature: "{degrees}" }
    reply: "好，调到{temperature}度。"

  - id: room_climate
    patterns:
      - "(现在)?(家里|屋里|室内)(现在)?(的)?(温度|室温)(是)?(多少度|多少|几度)(啊|呀|呢)?"
      - "(现在)?(家里|屋里|室内)(现在)?(有)?(多少度|几度)(啊|呀|呢)?"
      - "(现在)?(室温|室内温度)(是)?(多少度|多少|几度)(啊|呀|呢)?"
      - "(现在)?(家里|屋里|室内)(现在)?(的)?湿度(是)?(多少|几)(啊|呀|呢)?"
      - "(现在)?(家里|屋里)(现在)?(湿不湿|潮不潮)(啊|呀|呢)?"
    tool: ha.room_climate
    reply: "家里现在{reading}。"

  - id: guests_arrived
    patterns:
      - "(家里)?(有|来)(客人|客)了?(来了)?(啊|呀)?"
      - "客人来了(啊|呀)?"
    tool: guests.set
    args: { present: true }
    reply: "好，知道了。"

  - id: guests_left
    patterns:
      - "客人(都|已经|都已经)?走了(啊|呀)?"
    tool: guests.set
    args: { present: false }
    reply: "好，知道了。"
